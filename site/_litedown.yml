site:
  standalone: ["0??-snap-*", "0??-css-*"]
  manual:
    Render documents:
      desc: Convert Markdown and R Markdown to output formats.
      contents: [mark, fuse, html_format, markdown_options, vest]
    Code chunks and engines:
      desc: Parse and run code chunks, and customize the runtime.
      contents: [crack, engines, reactor, fuse_env, fuse_exit, get_context, timing_data, raw_text]
    Websites and books:
      desc: Build multi-page output and package sites.
      contents: [fuse_site, fuse_book, roam, pkg_site, pkg_desc]
  examples:
    Get started:
      desc: A minimal document.
      contents: ["001-*"]
    Text output:
      desc: Collapse, comment, print, filter, and otherwise control the text output of chunks.
      contents: ["006-*", "007-*", "013-*", "016-*", "017-*", "019-*", "025-*", "027-*"]
    Figures and tables:
      desc: Captions, graphics devices, figure decoration, plot files, and tables.
      contents: ["004-*", "008-*", "009-*", "010-*", "018-*"]
    Attributes:
      desc: Add attributes to output elements.
      contents: ["002-*", "003-*"]
    Inline code:
      desc: Inline R code and numeric output.
      contents: ["020-*"]
    Code chunks:
      desc: Provide, label, order, fill out, and extract the code of chunks.
      contents: ["005-*", "011-*", "012-*", "014-*", "015-*"]
    Widgets:
      desc: JavaScript widgets for tables, charts, and maps.
      contents: ["021-*", "022-*", "023-*", "024-*"]
    Slides:
      desc: Different styles/themes of slides.
      contents: ["045-*", "026-*"]
    Custom styles:
      desc: Change the look of a page interactively, or with a stylesheet from the web, such as Water.css, new.css, Simple.css, Pico, Sakura, Buttondown, or 98.css.
      contents: ["0??-css-*", "0??-windows-*"]
    Tests:
      desc: Miscellaneous tests.
      contents: ["test-*"]

output:
  html:
    meta:
      include_after: "_footer.md"
    options:
      number_sections: true
