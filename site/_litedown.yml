site:
  standalone: ["026-snap-clean*"]
  manual:
    Render documents:
      desc: Convert Markdown and R Markdown to output formats.
      contents: [mark, fuse, html_format, markdown_options, vest]
    Code chunks and engines:
      desc: Parse and run code chunks, and customize the runtime.
      contents: [crack, engines, reactor, fuse_env, fuse_exit, get_context, timing_data, raw_text]
    Websites and books:
      desc: Build multi-page output and package sites.
      contents: [fuse_site, fuse_book, roam, pkg_site, pkg_desc]
  examples:
    Examples 001-009:
      desc: A minimal example, and chunk options for attributes, captions, collapsing, comments, and graphics.
      contents: ["00*"]
    Examples 010-019:
      desc: Chunk options for plot files, labels, execution order, printing, tangling, results, whitespace, and tables.
      contents: ["01*"]
    Examples 020-029:
      desc: Inline output, JavaScript widgets, slides, raw output, and multibyte characters.
      contents: ["02*"]

output:
  html:
    meta:
      include_after: "_footer.md"
    options:
      number_sections: true
