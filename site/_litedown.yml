site:
  standalone: ["026-snap-clean*"]
  manual:
    Render documents:
      desc: Convert Markdown and R Markdown to output formats.
      contents: [mark, fuse, html_format, markdown_options, vest]
    Code chunks and engines:
      desc: Parse and run code chunks, and customize the runtime.
      contents: [crack, engines, reactor, fuse_env, fuse_exit, get_context, timing_data, raw_text]
    Websites and books:
      desc: Build multi-page output and package sites.
      contents: [fuse_site, fuse_book, roam, pkg_site, pkg_desc]
  examples:
    Get started:
      desc: A minimal document, and inline R code.
      contents: ["001-*", "020-*"]
    Code chunks:
      desc: Provide, label, order, fill out, extract, and print the code of chunks.
      contents: ["005-*", "011-*", "012-*", "013-*", "014-*", "015-*", "019-*"]
    Output:
      desc: Control the output of chunks, such as attributes, collapsing, comments, text results, whitespace, filtering, and raw output.
      contents: ["002-*", "003-*", "006-*", "007-*", "016-*", "017-*", "025-*", "027-*"]
    Figures and tables:
      desc: Captions, graphics devices, figure decoration, plot files, and tables.
      contents: ["004-*", "008-*", "009-*", "010-*", "018-*"]
    Widgets and slides:
      desc: JavaScript widgets, and slides with the clean theme.
      contents: ["021-*", "022-*", "023-*", "024-*", "026-*"]
    Tests:
      desc: Tests of Markdown, inline code, chunk options, and multibyte characters.
      contents: ["028-*", "test-*"]

output:
  html:
    meta:
      include_after: "_footer.md"
    options:
      number_sections: true
