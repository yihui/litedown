on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (${{ matrix.r }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        r: ['release', '4.5', '4.4', '4.3', '4.2', '4.1', '4.0', 'devel']
        include:
          # BEGIN generated by update-r-versions.yaml: R on older Ubuntu
          - os: ubuntu-24.04
            r: '3.6'
          - os: ubuntu-24.04
            r: '3.5'
          - os: ubuntu-24.04
            r: '3.4'
          - os: ubuntu-24.04
            r: '3.3'
          - os: ubuntu-24.04
            r: '3.2'
          - os: ubuntu-24.04
            r: '3.2.0'
          # END generated
          - r: devel
            http-user-agent: release
          - os: macOS-latest
            r: release
          - os: windows-latest
            r: release

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_RD_XREFS_: false

    steps:
      - uses: actions/checkout@HEAD

      - uses: r-lib/actions/setup-r@HEAD
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.http-user-agent }}
          use-public-rspm: true

      - name: Whether to use codecov
        run: |
          echo "USE_R_CODECOV=${{ (runner.os == 'Linux' && matrix.r == 'release') && true || false }}" >> $GITHUB_ENV

      - uses: yihui/actions/setup-r-dependencies@HEAD
        with:
          # install the package itself as we register vignette engine
          extra-packages: . ${{ env.USE_R_CODECOV == 'true' && ' covr' || '' }}
          # install dependencies for cairo_pdf device
          brew-packages: xquartz

      - uses: yihui/actions/check-r-package@HEAD

      - name: Run examples
        working-directory: examples
        run: |
          Rscript _run.R
          git diff --quiet || (git diff && exit 1)

      - name: Test coverage
        if: success() && env.USE_R_CODECOV == 'true'
        run: |
          cov = covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          writeLines(covr:::to_codecov(cov), 'codecov.json')
        shell: Rscript {0}

      - uses: codecov/codecov-action@HEAD
        if: env.USE_R_CODECOV == 'true'
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          files: ./codecov.json
          plugins: noop
          disable_search: true

