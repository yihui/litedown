on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

name: Update R versions matrix

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@HEAD

      - name: Update workflow matrix
        run: python3 .github/scripts/update-r-matrix.py

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to R version matrix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="update-r-versions"
          git checkout -B "$branch"
          git add .github/workflows/R-CMD-check.yaml
          git commit -m "Update R version matrix"
          git push -f origin "$branch"
          if ! gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr create --title "Update R version matrix" \
              --body "New R version(s) detected. Updated the CI matrix to include all minor versions from 3.2 to the latest release, each on the newest Ubuntu runner that supports it."
          fi
